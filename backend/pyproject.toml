[project]
name = "pepeapp-backend"
version = "0.1.0"
description = "PePeApp - Local AI Video Production Factory Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=12.0",
    "python-socketio>=5.11.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28.0",
    "aiofiles>=24.0.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ddgs>=1.0",
    "beautifulsoup4>=4.12",
    "moviepy>=1.0.3",
    "pillow>=10.0",
    "requests>=2.31",
    "anthropic>=0.50.0",
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
include = ["api*", "models*", "worker*"]

[tool.uv]
index-url = "https://pypi.org/simple"
